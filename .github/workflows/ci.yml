name: Cirrus Platform CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-cli:
    name: Validate CLI (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies & Build CLI
        run: |
          cd cli
          npm ci
          npx tsc --noEmit

  validate-go-service:
    name: Validate Microservice (Go)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.22'

      - name: Test Go Microservice Build
        run: |
          cd payment-api
          go mod init payment-api || true
          go build -v ./...

  validate-terraform:
    name: Validate Terraform IaC
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.6.0'

      - name: Terraform Init & Validate
        run: |
          cd terraform/modules/k8s-app
          terraform init -backend=false
          terraform validate