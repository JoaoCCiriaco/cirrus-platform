name: Cirrus Platform CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-cli:
    name: Validate CLI (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies & Build CLI
        run: |
          cd cli
          npm install --legacy-peer-deps
          npx tsc --noEmit --skipLibCheck || true

  validate-go-service:
    name: Validate Microservice (Go)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.22'

      - name: Test Go Microservice Build
        run: |
          cd payment-api
          go mod init payment-api || true
          go build -v ./...

  validate-terraform:
    name: Validate Terraform IaC
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.6.0'

      - name: Terraform Syntax Check
        run: |
          cd terraform/modules/k8s-app
          terraform fmt -check || true

  deploy-docs:
    name: Deploy Documentation Site
    runs-on: ubuntu-latest
    needs: [validate-cli, validate-go-service, validate-terraform]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: |
          pip install mkdocs-material mkdocs-static-i18n

      - name: Deploy Docs to GitHub Pages
        run: |
          mkdocs gh-deploy --force